</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="from-steady-state-to-dynamics">From steady state to dynamics</h1>
<p>Steady-state operability asks whether the desired outputs are reachable at all. Dynamic operability asks whether they are reachable within a finite number of steps, and how fast.</p>
<p>For <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>x</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo separator="true">,</mo><msub><mi>u</mi><mi>k</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">x_{k+1} = f(x_k, u_k)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.2083em;"></span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span><span class="mbin mtight">+</span><span class="mord mtight">1</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2083em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1076em;">f</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">u</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>  </mtext><msub><mi>y</mi><mi>k</mi></msub><mo>=</mo><mi>g</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\; y_k = g(x_k)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">g</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span>, the achievable output set at step <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>k</mi></mrow><annotation encoding="application/x-tex">k</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span></span></span></span> is</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><msup><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">S</mi></mrow><mi>k</mi></msup><mo stretchy="false">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>=</mo><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">{</mo><mtext> </mtext><msub><mi>y</mi><mi>k</mi></msub><mo>=</mo><mi>g</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>k</mi></msub><mo stretchy="false">)</mo><mtext>  </mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">∣</mo><mtext>  </mtext><msub><mi>u</mi><mi>j</mi></msub><mo>∈</mo><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">I</mi><mi mathvariant="normal">S</mi></mrow><mo separator="true">,</mo><mtext> </mtext><mi>j</mi><mo>=</mo><mn>0</mn><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><mi>k</mi><mo>−</mo><mn>1</mn><mtext> </mtext><mo fence="false" stretchy="true" minsize="1.2em" maxsize="1.2em">}</mo><mo separator="true">,</mo><mspace width="2em"/><mrow><mi mathvariant="normal">d</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">I</mi></mrow><mo stretchy="false">(</mo><mi>k</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>μ</mi><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><msup><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">S</mi></mrow><mi>k</mi></msup><mo>∩</mo><mrow><mi mathvariant="normal">D</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">S</mi></mrow><mo fence="true">)</mo></mrow></mrow><mrow><mi>μ</mi><mo stretchy="false">(</mo><mrow><mi mathvariant="normal">D</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">S</mi></mrow><mo stretchy="false">)</mo></mrow></mfrac><mo>×</mo><mn>100</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\mathrm{AOS}^{k}(x_0) = \big\{\, y_k = g(x_k) \;\big|\; u_j \in \mathrm{AIS},\ j = 0,\dots,k-1 \,\big\}, \qquad \mathrm{dOI}(k) = \frac{\mu\!\left(\mathrm{AOS}^{k} \cap \mathrm{DOS}\right)}{\mu(\mathrm{DOS})} \times 100\%
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.1723em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord"><span class="mord mathrm">AOS</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.9223em;"><span style="top:-3.1362em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight" style="margin-right:0.0315em;">k</span></span></span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">0</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.2em;vertical-align:-0.35em;"></span><span class="mord"><span class="delimsizing size1">{</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3361em;"><span style="top:-2.55em;margin-left:-0.0359em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 siz c-10,0,-16.667,5,-20,15z M188 15 H145 v585 v0 v585 h43z"/></svg></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.35em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord"><span class="mord mathnormal">u</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0572em;">j</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">∈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathrm">AIS</span></span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0572em;">j</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord">0</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0315em;">k</span><span class="mspa <h1 id="one-call">One call</h1>
<div class="columns wide-left">
<div class="anim">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> opyrability <span class="hljs-keyword">import</span> dynamic_operability
<span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

AIS = [[-<span class="hljs-number">1</span>, <span class="hljs-number">1</span>], [-<span class="hljs-number">1</span>, <span class="hljs-number">1</span>]]
DOS = [[-<span class="hljs-number">2</span>, <span class="hljs-number">2</span>], [-<span class="hljs-number">2</span>, <span class="hljs-number">2</span>]]
model = {<span class="hljs-string">&#x27;A&#x27;</span>: <span class="hljs-number">0.9</span>*np.eye(<span class="hljs-number">2</span>),
         <span class="hljs-string">&#x27;B&#x27;</span>: np.eye(<span class="hljs-number">2</span>),
         <span class="hljs-string">&#x27;C&#x27;</span>: np.eye(<span class="hljs-number">2</span>)}

results = dynamic_operability(model,           <span class="hljs-comment"># LTI dict or step fn</span>
                              x0=np.zeros(<span class="hljs-number">2</span>),  <span class="hljs-comment"># initial state</span>
                              AIS_bound=AIS,   <span class="hljs-comment"># input set</span>
                              DOS=DOS,         <span class="hljs-comment"># target outputs</span>
                              k_max=<span class="hljs-number">4</span>)         <span class="hljs-comment"># horizon</span>
<span class="hljs-built_in">print</span>(results[<span class="hljs-string">&#x27;dOI&#x27;</span>])  <span class="hljs-comment"># [25. 90.25 100. 100.]</span>
</code></pre>

<h1 id="pde-distributed-model">PDE, distributed model</h1>
<p>Transient mole balances on the molar holdups of each species (tube and shell) along the reactor length. Two equilibrium-limited reactions, with membrane <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi mathvariant="normal">H</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">\mathrm{H_2}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathrm">H</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathrm mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> removal shifting them forward (Le Chatelier):</p>

<h1 id="choosing-a-doi-evaluation">Choosing a dOI evaluation?</h1>
<div class="columns wide-left">
<div>
<p><img src="assets/dynamic-methods-comparison.png" alt="" style="width:560px;" /></p>
<div class="sub">Membrane-reactor funnel by three methods.</div>
</div>
<div>
<p>Same funnel, three ways to compute it:</p>
<ul>
<li><strong>exact linear projection</strong> for LTI systems (Minkowski sums, affine maps)</li>
<li><strong>nonlinear vertex projection</strong> in state space</li>
<li><strong>n-step simulation</strong> for any model</li>
</ul>
<p><code>dynamic_operability</code> picks one by state dimension and model type, or you force it with <code>method=</code>.</p>
</div>
</div>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="disturbance-scenarios-and-robust-operability">Disturbance scenarios and robust operability</h1>
<div class="columns wide-right">
<div class="tight">
<p>Build one funnel per distrubance scenario, then take their <strong>intersection</strong>: the outputs guaranteed reachable no matter which disturbance hits the process.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">scenario_results = dynamic_operability_scenarios(
    make_step,            <span class="hljs-comment"># step(x, u) for a feed d</span>
    make_initial_state,   <span class="hljs-comment"># steady state for feed d</span>
    AIS_bounds,
    scenarios={<span class="hljs-string">&#x27;Low quality well (92% CH4)&#x27;</span>:  <span class="hljs-number">92.0</span>,
               <span class="hljs-string">&#x27;High quality well (96% CH4)&#x27;</span>: <span class="hljs-number">96.0</span>},
    DOS=DOS_bounds, k_max=<span class="hljs-number">6</span>, engine=<span class="hljs-string">&#x27;plotly&#x27;</span>)
</code></pre>
<p>Empty for two minutes, then the robust region grows: adjusting inlet flowrates compensates for feed quality.</p>
<div class="sub"><a href="https://codes-group.github.io/opyrability/examples_gallery/dynamic_dma_mr.html">DMA-MR dynamic example</a></div>
</div>
<div>
<iframe class="anim" src="assets/dma_mr_scenarios_interactive.html?v=2" width="100%" height="500" style="border:0;border-radius:6px;"></iframe>
<div class="sub">Two scenario funnels and their robust intersection (blue). Drag to rotate.</div>
</div>
</div>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">

<h1 id="2-one-command-to-install">2. One command to install</h1>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="install-and-go">Install and go</h1>
<p>Before, running the inverse mapping meant installing IPOPT through conda first.</p>
<p>Now, one command:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">pip install opyrability
</code></pre>
<p><strong>That is it.</strong> It includes everything you need, the solver included. <code>cyipopt</code> stays optional, only for <code>method='ipopt'</code>.</p>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="powered-by-pounce">Powered by Pounce</h1>
<div style="display:flex;gap:60px;align-items:center;justify-content:center;margin:6px 0 20px;">
<img src="assets/pounce_A_pounce.png" height="150" />
<img src="assets/feral-banner.png" height="150" />
</div>
<p><strong>Pounce</strong> is a pure-Rust interior-point NLP solver from <strong>John Kitchin</strong>'s group at CMU, now the default for Opyrability's inverse mapping and design tools. Why is this important?</p>
<ul>
<li>installs as prebuilt <strong>wheels</strong>: nothing to compile, no third-party binaries, no MUMPS, no licensed HSL to track down</li>
<li>bundles <strong>FERAL</strong>, its own sparse symmetric-indefinite linear solver with certified inertia, so the interior-point steps stay reliable without an external solver</li>
<li>one <code>pip install</code> gives a fast, self-contained solver on Windows, macOS, and Linux</li>
</ul>
<div class="sub">kitchingroup.cheme.cmu.edu/pounce</div>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="pounce-in-action">Pounce in action</h1>
<div class="columns wide-left">
<div>
<p>Pounce is the default, so nothing changes in your call:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">fDIS, fDOS, msg = nlp_based_approach(model,        <span class="hljs-comment"># process model</span>
                                     DOS,          <span class="hljs-comment"># target outputs</span>
                                     resolution,   <span class="hljs-comment"># grid density</span>
                                     u0,           <span class="hljs-comment"># initial guess</span>
                                     lb, ub)       <span class="hljs-comment"># input bounds</span>
<span class="hljs-comment"># method=&#x27;pounce&#x27; by default; &#x27;ipopt&#x27; still available</span>
</code></pre>
</div>
<div>
<img class="anim" src="assets/pounce-mapping.png" width="470" />
</div>
</div>

<h1 id="optimal-modular-design-milp">Optimal modular design (MILP)</h1>
<div class="columns">
<div>
<img class="anim" src="assets/milp_dma_mr_example.png" width="520" />
</div>
<div>
<p>The multimodel polytopes turn the search for an optimal modular design into a single mixed-integer linear program, solved once per layer instead of many nonlinear solves.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">u_opt, y_opt, phi, *_ = milp_based_approach(
    model,             <span class="hljs-comment"># process model</span>
    AIS_bound=AIS,     <span class="hljs-comment"># input bounds</span>
    PI_target=cost,    <span class="hljs-comment"># metric to minimize</span>
    DOS_bounds=DOS,    <span class="hljs-comment"># target outputs</span>
    AIS_resolution=<span class="hljs-number">5</span>)  <span class="hljs-comment"># grid density</span>
</code></pre>
<div class="takeaway">One LP per layer, not many nonlinear solves: fast and mixed-integer linear.</div>
<div class="sub"><a href="https://codes-group.github.io/opyrability/algorithms.html#milp-based-multilayer-framework">MILP framework in the documentation</a></div>
</div>
</div>
<footer>opyrability 2.0</footer>
</section>

<h1 id="ml-surrogates-under-uncertainty">ML surrogates under uncertainty</h1>
<div class="columns wide-right">
<div>
<p>Fit a Gaussian process surrogate, then propagate its uncertainty through the dynamic analysis.</p>
<p>For a CSTR under a GP-NARX surrogate:</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mrow><mi mathvariant="normal">d</mi><mi mathvariant="normal">O</mi><mi mathvariant="normal">I</mi></mrow><mo>=</mo><mn>45.3</mn><mi mathvariant="normal">%</mi></mrow><annotation encoding="application/x-tex">\mathrm{dOI} = 45.3\%
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord"><span class="mord mathrm">dOI</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">45.3%</span></span></span></span></span></p><div class="sub">+3&sigma;: 51.7%, &minus;3&sigma;: 38.5%.</div>
<div class="defs"><b>AOS</b> is now a distribution; the mean and plus/minus three sigma funnels bound it.</div>

</div>
<div>
<p>Run in continuous integration on Python 3.11, 3.12, 3.13, and 3.14, and on every pull request. They cover:</p>
<ul>
<li>dynamic operability and funnels</li>
<li>design ranking and MILP design</li>
<li>Pyomo and implicit mapping</li>
<li>polytope geometry</li>
</ul>
</div>
</div>
<footer>opyrability 2.0</footer>
</section>

<h1 id="contributing">Contributing</h1>
<p>Opyrability is open source and welcomes contributions. It will always be that way.</p>
<ul>
<li><strong>Report a bug or request a feature</strong>: <a href="https://github.com/CODES-group/opyrability/issues">open an issue on GitHub</a></li>
<li><strong>Contribute code or a case study</strong>: <a href="https://github.com/CODES-group/opyrability">fork the repo</a>, branch, and open a pull request</li>
<li>CI runs the full test suite on your pull request across Python 3.11 to 3.14</li>
</ul>
<div class="sub">github.com/CODES-group/opyrability</div>
<footer>opyrability 2.0</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="opyrability 2.0" data-theme="90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--footer:opyrability 2.0;--theme:90hh0843i9yoxgbnq7gbq61pay1lha3gdylbswgjoeg;" data-marpit-pagination-total="35" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}">
<h1 id="upgrading-from-14x">Upgrading from 1.4.x</h1>
<ul>
<li>the default solver is now Pounce; for the IPOPT backend, pass <code>method='ipopt'</code> and install <code>cyipopt</code> from conda</li>
<li>Python 3.9 and 3.10 are no longer supported (both reached EOL); the minimum is 3.11</li>
<li>the conda package is retired; install with pip</li>
</ul>
<footer>opyrability 2.0</footer>

<h1 id="opyrability-20-at-a-glance">Opyrability 2.0 at a glance</h1>
<div class="columns">
<div>
<ol>
<li><strong>Dynamic operability</strong>: funnels + dOI, one call</li>
<li><strong>Pounce</strong> default solver, pure pip install</li>
<li><strong>rank designs</strong>, <strong>MILP based approach</strong></li>
<li><strong>P1 / P2 / P3</strong> inverse mapping s.t. PI</li>
<li><strong>Pyomo</strong> and ML surrogate models support</li>
<li><strong><code>OPYRABILITY.md</code></strong> agent skill</li>
<li><strong>147 tests</strong>, Python 3.11 to 3.14</li>
</ol>
<p><a href="https://codes-group.github.io/opyrability/">Docs</a> · <a href="https://github.com/CODES-group/opyrability">Code</a> · <a href="https://doi.org/10.21105/joss.05966">Paper</a></p>
